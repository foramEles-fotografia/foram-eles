    let isPlaying = true;
    let currentTime = 0;
    let lastTimestamp = performance.now();

    const btnPlay = document.getElementById('btn-play');
    const btnRestart = document.getElementById('btn-restart');
    const scrubber = document.getElementById('scrubber');
    const timeLabel = document.getElementById('time-label');
    const phaseBadge = document.getElementById('phase-badge');
    const btnExport = document.getElementById('btn-export');

    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      btnPlay.textContent = isPlaying ? 'Pausar' : 'Reproduzir';
      lastTimestamp = performance.now();
    });

    btnRestart.addEventListener('click', () => {
      currentTime = 0;
      isPlaying = true;
      btnPlay.textContent = 'Pausar';
      lastTimestamp = performance.now();
    });

    scrubber.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      isPlaying = false;
      btnPlay.textContent = 'Reproduzir';
      drawScene(currentTime);
    });

    document.querySelectorAll('.stage-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentTime = parseFloat(btn.getAttribute('data-jump'));
        isPlaying = true;
        btnPlay.textContent = 'Pausar';
        lastTimestamp = performance.now();
      });
    });

    function easeOutCubic(x) {
      x = Math.max(0, Math.min(1, x));
      return 1 - Math.pow(1 - x, 3);
    }

    function easeInOutCubic(x) {
      x = Math.max(0, Math.min(1, x));
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    const blobs = [
      { r: 27,  g: 98,  b: 248, rad: 430, sx: 0.55, sy: 0.45, ph: 0.0, ox: 510, oy: 210, a: 0.34 },
      { r: 124, g: 92,  b: 255, rad: 390, sx: -0.42, sy: 0.52, ph: 1.6, ox: 540, oy: 225, a: 0.25 },
      { r: 0,   g: 205, b: 255, rad: 350, sx: 0.48, sy: -0.38, ph: 3.1, ox: 460, oy: 185, a: 0.20 },
      { r: 255, g: 95,  b: 65,  rad: 310, sx: -0.36, sy: -0.46, ph: 4.5, ox: 500, oy: 200, a: 0.13 },
      { r: 255, g: 185, b: 45,  rad: 280, sx: 0.62, sy: 0.34, ph: 5.4, ox: 410, oy: 170, a: 0.10 }
    ];

    function drawBackground(t) {
      ctx.fillStyle = '#1a202c';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (const b of blobs) {
        const cx = W * 0.5 + Math.cos(t * b.sx + b.ph) * b.ox + Math.sin(t * 0.25 + b.ph) * 90;
        const cy = H * 0.5 + Math.sin(t * b.sy + b.ph) * b.oy + Math.cos(t * 0.30 + b.ph) * 60;
        const rad = b.rad * (1 + 0.14 * Math.sin(t * 0.8 + b.ph));
        const g = ctx.createRadialGradient(cx, cy, rad * 0.05, cx, cy, rad);
        g.addColorStop(0, `rgba(${b.r}, ${b.g}, ${b.b}, ${b.a})`);
        g.addColorStop(0.55, `rgba(${b.r}, ${b.g}, ${b.b}, ${b.a * 0.42})`);
        g.addColorStop(1, `rgba(${b.r}, ${b.g}, ${b.b}, 0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, H * 0.35, W * 0.5, H * 0.5, W * 0.65);
      vig.addColorStop(0, 'rgba(18, 22, 31, 0)');
      vig.addColorStop(1, 'rgba(14, 18, 26, 0.52)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);
    }

    function drawCaret(x, y, h, t, alphaMult = 1) {
      if (alphaMult <= 0.01) return;
      const blink = 0.5 + 0.5 * Math.sin(t * 14);
      ctx.save();
      ctx.fillStyle = `rgba(27, 98, 248, ${alphaMult * (0.45 + 0.55 * blink)})`;
      ctx.fillRect(x, y, 6, h);
      ctx.restore();
    }

    const S1 = 1.4;
    const Y_TOP = 36 * S1;
    const GH = (202 - 36) * S1;

    function drawIm1Slice(x1, x2, y1, y2, dx, dy, alpha = 1) {
      if (!imgFinal.complete) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.drawImage(imgFinal, x1, y1, x2 - x1, y2 - y1, dx, dy + (y1 * S1 - Y_TOP), (x2 - x1) * S1, (y2 - y1) * S1);
      ctx.restore();
    }

    function drawF_fromFE(dx, dy, alpha = 1) {
      if (!imgFE.complete) return 171;
      const capH = (200 - 38) * S1;
      const fw = 315 * (capH / 419);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.drawImage(imgFE, 112, 302, 315, 419, dx, dy + (38 * S1 - Y_TOP), fw, capH);
      ctx.restore();
      return fw;
    }

    function drawPhotoCard(img, curPX, curPY, cardW, cardH, alpha, yBias) {
      if (!img.complete) return;
      ctx.save();
      ctx.globalAlpha = Math.min(alpha, 1);
      ctx.shadowColor = 'rgba(27, 98, 248, 0.32)';
      ctx.shadowBlur = 30;

      ctx.beginPath();
      ctx.roundRect(curPX, curPY, cardW, cardH, 22);
      ctx.clip();

      const sw = img.width, sh = img.height;
      const coverScale = Math.max(cardW / sw, cardH / sh);
      const dw = sw * coverScale, dh = sh * coverScale;
      ctx.drawImage(img, curPX + (cardW - dw) / 2, curPY + (cardH - dh) * yBias, dw, dh);
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = Math.min(alpha, 1);
      ctx.strokeStyle = 'rgba(96, 165, 250, 0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(curPX, curPY, cardW, cardH, 22);
      ctx.stroke();
      ctx.restore();
    }

    function drawScene(t) {
      drawBackground(t);
      const centerY = SAFE_CENTER_Y - GH / 2;

      if (t < 2.1) {
        phaseBadge.textContent = 'Etapa 1: Surge FE. (Typing Natural)';
        const showF = t >= 0.45;
        const showE = t >= 0.82;
        const showDot = t >= 1.18;

        const wF = 171 + 12;
        const wE = (422 - 290) * S1 + 14;
        const wDot = (734 - 696) * S1;

        let curW = (showF ? wF : 0) + (showE ? wE : 0) + (showDot ? wDot : 0);
        let cx = (W - Math.max(curW, 10)) / 2;

        if (showF) { drawF_fromFE(cx, centerY); cx += wF; }
        if (showE) { drawIm1Slice(290, 422, 36, 202, cx, centerY); cx += wE; }
        if (showDot) { drawIm1Slice(696, 734, 155, 202, cx, centerY); cx += wDot; }

        drawCaret(cx + 6, centerY + 10, GH - 20, t, t < 0.45 ? easeOutCubic(t / 0.35) : 1);
      }
      else if (t < 5.2) {
        phaseBadge.textContent = 'Etapa 2: FE. se torna Foram Eles.';
        const oramSpecs = [
          { ch: 'o', time: 2.25, w: 114 },
          { ch: 'r', time: 2.44, w: 90 },
          { ch: 'a', time: 2.63, w: 110 },
          { ch: 'm', time: 2.82, w: 176 },
          { ch: ' ', time: 3.00, w: 44 }
        ];
        const lesSpecs = [
          { x1: 430, x2: 502, y1: 36, y2: 202, time: 3.32, adv: (508 - 430) * S1 },
          { x1: 508, x2: 604, y1: 88, y2: 202, time: 3.52, adv: (606 - 508) * S1 },
          { x1: 606, x2: 686, y1: 88, y2: 202, time: 3.72, adv: (696 - 606) * S1 }
        ];

        let oramW = 0;
        const activeOram = [];
        for (const item of oramSpecs) {
          if (t >= item.time) {
            const p = easeOutCubic(Math.min((t - item.time) / 0.14, 1));
            activeOram.push({ ...item, p });
            oramW += item.w * p;
          }
        }

        let lesW = 0;
        const activeLes = [];
        for (const item of lesSpecs) {
          if (t >= item.time) {
            const p = easeOutCubic(Math.min((t - item.time) / 0.14, 1));
            activeLes.push({ ...item, p });
            lesW += item.adv * p;
          }
        }

        const wF = 177;
        const eToLGap = (430 - 290) * S1;
        const wDot = (734 - 696) * S1;
        const totalW = wF + oramW + eToLGap + lesW + wDot;
        let cx = (W - totalW) / 2;

        drawF_fromFE(cx, centerY);
        cx += wF;

        ctx.save();
        ctx.font = '216px "Bodoni MT", "Didot", "Modern No. 20", Georgia, serif';
        ctx.fillStyle = '#ffffff';
        for (const item of activeOram) {
          if (item.ch !== ' ') {
            ctx.globalAlpha = item.p;
            ctx.fillText(item.ch, cx, centerY + 229 + (1 - item.p) * 8);
          }
          cx += item.w * item.p;
        }
        ctx.restore();

        const caretOram = cx;
        drawIm1Slice(290, 422, 36, 202, cx, centerY);
        cx += eToLGap;

        for (const item of activeLes) {
          drawIm1Slice(item.x1, item.x2, item.y1, item.y2, cx, centerY + (1 - item.p) * 8, item.p);
          cx += item.adv * item.p;
        }
        const caretLes = cx;
        drawIm1Slice(696, 734, 155, 202, cx, centerY);

        if (t < 3.15) drawCaret(caretOram + 2, centerY + 65, GH - 70, t, 1);
        else if (t < 4.35) drawCaret(caretLes + 2, centerY + 65, GH - 70, t, 1);
        else drawCaret(cx + wDot + 6, centerY + 65, GH - 70, t, Math.max(0, 1 - (t - 4.35) / 0.4));
      }
      else if (t < 7.4) {
        phaseBadge.textContent = 'Etapa 3: Logo Final FORAM Eles. (2ª Foto)';
        const retract = t < 5.75 ? easeInOutCubic((t - 5.2) / 0.55) : 1;
        const keep = 1 - retract;
        const fullPrefixW = 177 + 534;
        const curPrefixW = fullPrefixW * keep;
        const elesTotalW = (734 - 290) * S1;
        const startX = (W - (curPrefixW + elesTotalW)) / 2;
        const elesX = startX + curPrefixW;

        if (keep > 0.01) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(startX, centerY - 20, curPrefixW, GH + 40);
          ctx.clip();
          drawF_fromFE(startX, centerY, keep);
          ctx.font = '216px "Bodoni MT", "Didot", "Modern No. 20", Georgia, serif';
          ctx.fillStyle = `rgba(255,255,255,${keep})`;
          ctx.fillText('oram', startX + 177, centerY + 229);
          ctx.restore();
        }

        const baseE = 290 * S1;
        drawIm1Slice(290, 422, 36, 202, elesX + 290 * S1 - baseE, centerY);
        drawIm1Slice(430, 502, 36, 202, elesX + 430 * S1 - baseE, centerY);
        drawIm1Slice(508, 604, 88, 202, elesX + 508 * S1 - baseE, centerY);
        drawIm1Slice(606, 686, 88, 202, elesX + 606 * S1 - baseE, centerY);
        drawIm1Slice(696, 734, 155, 202, elesX + 696 * S1 - baseE, centerY);

        const foramTop = [
          { x1: 510, x2: 531, time: 5.82 },
          { x1: 537, x2: 569, time: 5.97 },
          { x1: 576, x2: 604, time: 6.12 },
          { x1: 608, x2: 640, time: 6.27 },
          { x1: 647, x2: 685, time: 6.42 }
        ];
        let lastX = elesX + 510 * S1 - baseE;
        for (const f of foramTop) {
          if (t >= f.time) {
            const p = easeOutCubic(Math.min((t - f.time) / 0.12, 1));
            const dx = elesX + f.x1 * S1 - baseE;
            drawIm1Slice(f.x1, f.x2, 36, 82, dx, centerY - (1 - p) * 6, p);
            lastX = dx + (f.x2 - f.x1) * S1;
          }
        }
        if (t >= 5.75 && t <= 6.85) {
          const fade = t < 6.55 ? 1 : Math.max(0, 1 - (t - 6.55) / 0.3);
          drawCaret(lastX + 5, centerY + 2, 62, t, fade);
        }
      }
      else {
        phaseBadge.textContent = 'Etapa 4: 3 Fotos (Foto 1 • Foto 2 • Foto 1) se espremendo suavemente + Logo no Topo Direito';
        const moveProg = easeInOutCubic(Math.min((t - 7.4) / 1.25, 1));
        const scaleLogo = 1 - 0.55 * moveProg;
        const fullW = (734 - 290) * S1;
        const fullH = GH;
        const lw = fullW * scaleLogo;
        const lh = fullH * scaleLogo;

        const startLX = (W - fullW) / 2;
        const startLY = centerY;
        const targetLX = W - lw - 95;
        const targetLY = 118;
        const curLX = startLX + (targetLX - startLX) * moveProg;
        const curLY = startLY + (targetLY - startLY) * moveProg;

        const sq1 = t > 8.75 ? easeInOutCubic(Math.min((t - 8.75) / 1.20, 1)) : 0;
        const sq2 = t > 10.05 ? easeInOutCubic(Math.min((t - 10.05) / 1.20, 1)) : 0;

        const curW = 440 - 44 * sq1 - 40 * sq2;
        const curH = 530 - 54 * sq1 - 46 * sq2;
        const slotY = SAFE_CENTER_Y - curH * 0.5 + 4;
        const gap = 38;

        const slot1X = 220 - 55 * sq1 - 40 * sq2;
        const slot2X = slot1X + curW + gap;
        const slot3X = slot2X + curW + gap;

        if (t >= 7.50) {
          const p1 = easeOutCubic(Math.min((t - 7.50) / 1.15, 1));
          const x1 = -480 + (slot1X - (-480)) * p1;
          const y1 = (H + 180) + (slotY - (H + 180)) * p1;
          drawPhotoCard(imgSocios1, x1, y1, curW, curH, p1 * 1.3, 0.34);
        }

        if (t >= 8.70) {
          const p2 = easeOutCubic(Math.min((t - 8.70) / 1.20, 1));
          const x2 = (slot1X + 120) + (slot2X - (slot1X + 120)) * p2;
          const y2 = (H + 200) + (slotY - (H + 200)) * p2;
          drawPhotoCard(imgSocios2, x2, y2, curW, curH, p2 * 1.3, 0.26);
        }

        if (t >= 10.00) {
          const p3 = easeOutCubic(Math.min((t - 10.00) / 1.20, 1));
          const x3 = (slot2X + 120) + (slot3X - (slot2X + 120)) * p3;
          const y3 = (H + 200) + (slotY - (H + 200)) * p3;
          drawPhotoCard(imgSocios1, x3, y3, curW, curH, p3 * 1.3, 0.34);
        }

        if (imgFinal.complete) {
          ctx.drawImage(imgFinal, 290, 36, 734 - 290, 202 - 36, curLX, curLY, lw, lh);
        }
      }
    }

    function loop(now) {
      if (isPlaying) {
        const dt = (now - lastTimestamp) / 1000;
        currentTime += dt;
        if (currentTime > DURATION) currentTime = 0;
        scrubber.value = currentTime.toFixed(2);
      }
      lastTimestamp = now;
      timeLabel.textContent = `${currentTime.toFixed(1)}s / ${DURATION.toFixed(1)}s`;
      drawScene(currentTime);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    btnExport.addEventListener('click', () => {
      if (typeof canvas.captureStream !== 'function') return;
      btnExport.disabled = true;
      btnExport.textContent = 'Gravando 13.5s...';
      currentTime = 0;
      isPlaying = true;
      lastTimestamp = performance.now();

      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'video-foram-eles.webm';
        a.click();
        btnExport.disabled = false;
        btnExport.textContent = 'Gravar & Baixar WebM';
      };
      recorder.start();
      setTimeout(() => {
        if (recorder.state === 'recording') recorder.stop();
      }, DURATION * 1000 + 150);
    });
  </script>
</body>
